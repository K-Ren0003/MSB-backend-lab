services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: msb_backend_lab
      POSTGRES_USER: msb
      POSTGRES_PASSWORD: msb
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U msb -d msb_backend_lab"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:8
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  init-db:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://msb:msb@postgres:5432/msb_backend_lab
    depends_on:
      postgres:
        condition: service_healthy
    command: ["python", "-m", "api.app.init_db"]
    restart: "no"

  api:
    build:
      context: .
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://msb:msb@postgres:5432/msb_backend_lab
      MONGO_URL: mongodb://mongo:27017
      MONGO_DATABASE: msb_backend_lab
    depends_on:
      init-db:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  mongo_data: