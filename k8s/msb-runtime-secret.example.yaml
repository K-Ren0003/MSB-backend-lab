# Copy these values into the ignored .k8s-runtime.env file on the Ubuntu node.
# Do not apply or commit a real Secret manifest.
apiVersion: v1
kind: Secret
metadata:
  name: msb-runtime
  namespace: msb
type: Opaque
stringData:
  POSTGRES_DB: msb_backend_lab
  POSTGRES_USER: msb
  POSTGRES_PASSWORD: REPLACE_WITH_A_STRONG_POSTGRES_PASSWORD
  MONGO_INITDB_ROOT_USERNAME: msb
  MONGO_INITDB_ROOT_PASSWORD: REPLACE_WITH_A_STRONG_MONGO_PASSWORD
  DATABASE_URL: postgresql+psycopg://msb:REPLACE_WITH_A_STRONG_POSTGRES_PASSWORD@postgres:5432/msb_backend_lab
  MONGO_URL: mongodb://msb:REPLACE_WITH_A_STRONG_MONGO_PASSWORD@mongo:27017/?authSource=admin
